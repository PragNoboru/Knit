# CLAUDE.md: CI runs lint, typecheck, unit and fixture tests on every push, and integration
# tests with the Supabase CLI.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # Node version comes from "engines.node" in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The same integration tests on in-process Postgres, so the Docker-free fallback stays
      # in step with real Supabase.
      - run: pnpm test:int:pglite
      - run: pnpm build

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile

      # Only what the tests use: the database, Auth, the REST API and its gateway. Starting
      # applies every migration and the seed to a fresh database.
      - name: Start local Supabase
        run: >
          pnpm exec supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          > supabase-start.log 2>&1

      # Job logs need repository admin rights to download, so a failed start is also posted as
      # an annotation, which anyone who can see the repository can read.
      - name: Report a failed Supabase start
        if: failure()
        run: |
          cat supabase-start.log
          message=$(tail -c 4000 supabase-start.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')
          echo "::error title=supabase start failed::${message}"

      - name: Integration tests
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
          pnpm test:int

  e2e:
    name: End-to-end flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: >
          pnpm exec supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          > supabase-start.log 2>&1

      - name: Report a failed Supabase start
        if: failure()
        run: |
          cat supabase-start.log
          message=$(tail -c 4000 supabase-start.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')
          echo "::error title=supabase start failed::${message}"

      # N16: local sheet mode, with the example trackers as the Knit folder.
      - name: App environment
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "KNIT_CRON_SECRET=$(openssl rand -hex 32)"
            echo "APP_URL=http://localhost:3000"
            echo "KNIT_SHEET_SOURCE=local"
          } > .env.local
          echo "KNIT_SEED_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      # PRD 17: time is injected. Knit connects the example trackers on Mon 28 Sep 2026 (go-live),
      # then its clock moves to Wed 30 Sep and the close job closes 28 and 29 Sep, so the flows
      # see spillovers and locked days.
      # Noboru and Sapiens stay unconnected: the admin flow sets one up through the wizard.
      - name: Seed users and the example trackers on Mon 28 Sep 2026
        env:
          KNIT_SEED_TRACKERS: "Filing Buddy · Google Ads,Filing Buddy · Meta Ads"
        run: |
          bash scripts/ci-set-clock.sh 2026-09-28
          pnpm seed:local > seed.log 2>&1 || { cat seed.log; echo "::error title=seed failed::$(tail -c 3000 seed.log | tr '\n' ' ')"; exit 1; }
      - name: Move to Wed 30 Sep 2026 and close the days between
        run: |
          bash scripts/ci-set-clock.sh 2026-09-30
          pnpm seed:local close > close.log 2>&1 || { cat close.log; echo "::error title=close failed::$(tail -c 3000 close.log | tr '\n' ' ')"; exit 1; }
      # The seeded admin can sign in with email and password (the reply's tokens are never printed).
      - name: Sign-in check
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
          curl -s -X POST "$API_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@knit.test\",\"password\":\"$KNIT_SEED_PASSWORD\"}" \
          | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d||'{}');if(j.access_token){console.log('Sign-in works.')}else{console.log('::error title=Sign-in check::'+(j.msg||j.error_description||j.error_code||'no token'));process.exit(1)}})"
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Failures also become annotations (Playwright's github reporter), which anyone who can
      # see the repository can read; the server's own output is kept in e2e.log.
      - name: End-to-end flows
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log
      - name: Report the server output of a failed run
        if: failure() || cancelled()
        run: |
          echo "::error title=e2e server errors::$(grep -iE 'error|⨯|digest' e2e.log | grep -v '^ *at ' | head -c 3500 | tr '\n' ' ')"
          echo "::error title=e2e last lines::$(tail -c 3000 e2e.log | tr '\n' ' ')"
          echo "::error title=e2e server error context::$(grep -B4 -A10 'RpcError' e2e.log | head -c 3500 | tr '\n' ' ')"
          # The page as it was when each test failed (artifacts need a sign-in; annotations do not).
          for f in $(find test-results -name error-context.md 2>/dev/null | head -3); do
            echo "::error title=e2e page at failure::$(head -c 3500 "$f" | tr '\n' ' ')"
          done

      # M7: screenshots at 1280 px and 390 px, and the report of any failure.
      - name: Keep the screenshots and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/screenshots/
            test-results/output/
          retention-days: 14
