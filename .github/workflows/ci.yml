# CLAUDE.md: CI runs lint, typecheck, unit and fixture tests on every push.
# Integration tests against local Supabase join this workflow in M1.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # Node version comes from "engines.node" in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
